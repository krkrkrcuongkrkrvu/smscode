<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SMS OTP - Hero SMS</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #f1f3f7;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 15px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }

    /* Header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding: 0 5px;
    }

    .header-left h1 {
      font-size: 20px;
      font-weight: 800;
      color: #111827;
      line-height: 1.2;
    }

    .header-left a {
      font-size: 13px;
      color: #3b82f6;
      text-decoration: underline;
      cursor: pointer;
    }

    .header-right .settings-btn {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 24px;
      color: #374151;
      padding: 2px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.2s;
    }

    .header-right .settings-btn:hover {
      transform: rotate(45deg);
    }

    /* Cards */
    .card {
      background: #ffffff;
      border-radius: 14px;
      padding: 16px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }

    /* Action Buttons */
    .btn-group {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    .btn {
      flex: 1;
      border: none;
      border-radius: 10px;
      padding: 12px 0;
      font-size: 15px;
      font-weight: 700;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.12);
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .btn-buy {
      background: #6366f1; /* Tím xanh */
      flex: 1.4;
    }

    .btn-cancel {
      background: #ef4444; /* Đỏ cam */
      flex: 1;
    }

    .status-text {
      text-align: center;
      font-size: 13px;
      font-weight: 600;
      color: #ef4444; /* Mặc định đỏ như ảnh */
      min-height: 18px;
    }

    /* Result Section */
    .result-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .field-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .field-label {
      font-size: 13px;
      font-weight: 600;
      color: #374151;
    }

    .dashed-box {
      width: 100%;
      border: 1.5px dashed #cbd5e1;
      border-radius: 8px;
      padding: 14px 10px;
      text-align: center;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: background-color 0.15s, border-color 0.15s;
    }

    .dashed-box:hover {
      background-color: #f8fafc;
      border-color: #94a3b8;
    }

    .text-phone {
      color: #6366f1;
      letter-spacing: 0.5px;
    }

    .text-otp {
      color: #10b981;
      letter-spacing: 2px;
      font-size: 18px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 25px;
      left: 50%;
      transform: translateX(-50%);
      background: #1f2937;
      color: white;
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 12px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s;
      z-index: 100;
    }

    .toast.show {
      opacity: 1;
    }

    /* Settings Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.4);
      justify-content: center;
      align-items: center;
      z-index: 99;
      padding: 15px;
    }

    .modal-content {
      background: white;
      border-radius: 12px;
      padding: 20px;
      width: 100%;
      max-width: 350px;
    }

    .modal-content h3 {
      font-size: 16px;
      margin-bottom: 12px;
      color: #111827;
    }

    .modal-content label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: #4b5563;
      margin-top: 8px;
      margin-bottom: 3px;
    }

    .modal-content input {
      width: 100%;
      padding: 8px 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 13px;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      margin-top: 16px;
    }

    .modal-actions button {
      padding: 7px 14px;
      border-radius: 6px;
      border: none;
      font-size: 13px;
      cursor: pointer;
    }

    .btn-save {
      background: #6366f1;
      color: white;
      font-weight: 600;
    }

    .btn-close {
      background: #e5e7eb;
      color: #374151;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="header-left">
        <h1>SMS</h1>
        <a onclick="location.reload()">Tải lại trang</a>
      </div>
      <div class="header-right">
        <button class="settings-btn" onclick="openSettings()" title="Cài đặt">⚙️</button>
      </div>
    </div>

    <!-- Nút hành động -->
    <div class="card">
      <div class="btn-group">
        <button id="btnBuy" class="btn btn-buy" onclick="buyNumber()">
          🛒 MUA NGAY
        </button>
        <button id="btnCancel" class="btn btn-cancel" onclick="changeNumber()">
          🔄 ĐỔI SỐ
        </button>
      </div>
      <div id="statusText" class="status-text">Sẵn sàng</div>
    </div>

    <!-- Kết quả -->
    <div class="card result-group">
      <div class="field-block">
        <div class="field-label">SỐ ĐIỆN THOẠI (Chạm để Copy)</div>
        <div id="boxPhone" class="dashed-box text-phone" onclick="copyToClipboard('phone')">
          ---
        </div>
      </div>

      <div class="field-block">
        <div class="field-label">MÃ OTP (Chạm để Copy)</div>
        <div id="boxOtp" class="dashed-box text-otp" onclick="copyToClipboard('otp')">
          ---
        </div>
      </div>
    </div>
  </div>

  <!-- Thông báo copy -->
  <div id="toast" class="toast">Đã sao chép!</div>

  <!-- Modal Cài đặt cấu hình -->
  <div id="settingsModal" class="modal">
    <div class="modal-content">
      <h3>Cài đặt API</h3>
      <label>API Key:</label>
      <input type="text" id="cfgApiKey" value="c57579fb8d850494cfb275Ade1126ef4">

      <label>Mã Dịch vụ (TikTok = lf):</label>
      <input type="text" id="cfgService" value="lf">

      <label>ID Quốc gia (Colombia = 34):</label>
      <input type="text" id="cfgCountry" value="34">

      <label>Giá tối đa ($):</label>
      <input type="text" id="cfgPrice" value="0.021">

      <label>CORS Proxy (để trống nếu không dùng):</label>
      <input type="text" id="cfgProxy" value="https://corsproxy.io/?">

      <div class="modal-actions">
        <button class="btn-close" onclick="closeSettings()">Đóng</button>
        <button class="btn-save" onclick="saveSettings()">Lưu lại</button>
      </div>
    </div>
  </div>

  <script>
    // Cấu hình mặc định
    let config = {
      apiKey: localStorage.getItem('hero_apiKey') || 'c57579fb8d850494cfb275Ade1126ef4',
      service: localStorage.getItem('hero_service') || 'lf',       // TikTok/Douyin
      country: localStorage.getItem('hero_country') || '34',       // Colombia (ID 34 trên hệ thống SMS-Activate/HeroSMS)
      maxPrice: localStorage.getItem('hero_maxPrice') || '0.021',
      corsProxy: localStorage.getItem('hero_corsProxy') || 'https://corsproxy.io/?'
    };

    let currentActivationId = null;
    let currentPhoneNumber = '';
    let currentOtp = '';
    let pollingTimer = null;

    const btnBuy = document.getElementById('btnBuy');
    const btnCancel = document.getElementById('btnCancel');
    const statusText = document.getElementById('statusText');
    const boxPhone = document.getElementById('boxPhone');
    const boxOtp = document.getElementById('boxOtp');
    const toast = document.getElementById('toast');

    // Hàm gọi API của hero-sms qua Proxy
    async function callHeroApi(params) {
      const url = `https://hero-sms.com/stubs/handler_api.php?api_key=${encodeURIComponent(config.apiKey)}&${params}`;
      const finalUrl = config.corsProxy ? (config.corsProxy + encodeURIComponent(url)) : url;

      const res = await fetch(finalUrl);
      if (!res.ok) throw new Error(`HTTP Error ${res.status}`);
      return await res.text();
    }

    // Cập nhật trạng thái hiển thị
    function setStatus(text, color = '#ef4444') {
      statusText.innerText = text;
      statusText.style.color = color;
    }

    // 1. Mua số mới
    async function buyNumber() {
      stopPolling();
      btnBuy.disabled = true;
      setStatus('Đang mua số mới...', '#3b82f6');
      boxPhone.innerText = 'Đang tải...';
      boxOtp.innerText = '---';

      try {
        const query = `action=getNumber&service=${config.service}&country=${config.country}&maxPrice=${config.maxPrice}`;
        const resp = (await callHeroApi(query)).trim();

        // Định dạng trả về: ACCESS_NUMBER:$id:$number
        if (resp.startsWith('ACCESS_NUMBER')) {
          const parts = resp.split(':');
          currentActivationId = parts[1];
          currentPhoneNumber = parts[2];

          boxPhone.innerText = currentPhoneNumber;
          setStatus('Chờ nhận OTP...', '#eab308');
          startPollingOtp();
        } else {
          // Các lỗi phổ biến: NO_NUMBERS, NO_BALANCE, BAD_KEY, etc.
          setStatus(`Lỗi: ${resp}`, '#ef4444');
          boxPhone.innerText = '---';
        }
      } catch (err) {
        setStatus('Lỗi kết nối API / CORS', '#ef4444');
        boxPhone.innerText = '---';
        console.error(err);
      } finally {
        btnBuy.disabled = false;
      }
    }

    // 2. Đổi số (Hủy số hiện tại và mua số mới)
    async function changeNumber() {
      if (!currentActivationId) {
        buyNumber();
        return;
      }

      stopPolling();
      btnCancel.disabled = true;
      setStatus('Đang hủy số và hoàn tiền...', '#ef4444');

      try {
        // status 8: Hủy kích hoạt / không nhận được mã
        await callHeroApi(`action=setStatus&status=8&id=${currentActivationId}`);
      } catch (e) {
        console.warn('Lỗi khi hủy:', e);
      }

      currentActivationId = null;
      btnCancel.disabled = false;
      buyNumber();
    }

    // 3. Vòng lặp kiểm tra mã OTP
    function startPollingOtp() {
      if (!currentActivationId) return;

      pollingTimer = setInterval(async () => {
        try {
          const resp = (await callHeroApi(`action=getStatus&id=${currentActivationId}`)).trim();

          if (resp.startsWith('STATUS_OK')) {
            // Định dạng: STATUS_OK:123456
            const otp = resp.split(':')[1];
            currentOtp = otp;
            boxOtp.innerText = otp;
            setStatus('Đã có mã OTP!', '#10b981');
            stopPolling();
          } else if (resp === 'STATUS_WAIT_CODE') {
            setStatus('Đang chờ gửi mã...', '#3b82f6');
          } else if (resp === 'STATUS_CANCEL') {
            setStatus('Số đã bị hủy', '#ef4444');
            stopPolling();
          }
        } catch (e) {
          console.error('Lỗi khi poll OTP:', e);
        }
      }, 3000); // Kiểm tra lại mỗi 3 giây
    }

    function stopPolling() {
      if (pollingTimer) {
        clearInterval(pollingTimer);
        pollingTimer = null;
      }
    }

    // Copy vào bộ nhớ tạm
    function copyToClipboard(type) {
      let val = '';
      if (type === 'phone') {
        val = currentPhoneNumber || (boxPhone.innerText !== '---' ? boxPhone.innerText : '');
      } else if (type === 'otp') {
        val = currentOtp || (boxOtp.innerText !== '---' ? boxOtp.innerText : '');
      }

      if (!val || val === '---' || val === 'Đang tải...') return;

      navigator.clipboard.writeText(val).then(() => {
        toast.innerText = `Đã sao chép: ${val}`;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1600);
      });
    }

    // Cài đặt Modal
    function openSettings() {
      document.getElementById('cfgApiKey').value = config.apiKey;
      document.getElementById('cfgService').value = config.service;
      document.getElementById('cfgCountry').value = config.country;
      document.getElementById('cfgPrice').value = config.maxPrice;
      document.getElementById('cfgProxy').value = config.corsProxy;
      document.getElementById('settingsModal').style.display = 'flex';
    }

    function closeSettings() {
      document.getElementById('settingsModal').style.display = 'none';
    }

    function saveSettings() {
      config.apiKey = document.getElementById('cfgApiKey').value.trim();
      config.service = document.getElementById('cfgService').value.trim();
      config.country = document.getElementById('cfgCountry').value.trim();
      config.maxPrice = document.getElementById('cfgPrice').value.trim();
      config.corsProxy = document.getElementById('cfgProxy').value.trim();

      localStorage.setItem('hero_apiKey', config.apiKey);
      localStorage.setItem('hero_service', config.service);
      localStorage.setItem('hero_country', config.country);
      localStorage.setItem('hero_maxPrice', config.maxPrice);
      localStorage.setItem('hero_corsProxy', config.corsProxy);

      closeSettings();
      setStatus('Đã lưu cài đặt mới', '#10b981');
    }
  </script>
</body>
</html>

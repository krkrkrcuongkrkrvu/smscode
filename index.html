<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Tool Widget - Brazil</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            user-select: none;
        }

        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        .widget-card {
            background: #ffffff;
            width: 100%;
            max-width: 380px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
            padding: 20px 18px;
            position: relative;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 16px;
        }

        .title-group h2 {
            font-size: 20px;
            font-weight: 800;
            color: #111827;
            line-height: 1.1;
        }

        .refresh-link {
            font-size: 13px;
            color: #4f46e5;
            text-decoration: underline;
            cursor: pointer;
            margin-top: 2px;
            display: inline-block;
        }

        .gear-btn {
            background: none;
            border: none;
            font-size: 24px;
            cursor: pointer;
            color: #374151;
            padding: 2px;
            border-radius: 50%;
            transition: transform 0.2s;
        }

        .gear-btn:hover {
            transform: rotate(45deg);
        }

        .btn-group {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 10px;
            margin-bottom: 14px;
        }

        .btn {
            border: none;
            border-radius: 8px;
            padding: 12px 10px;
            font-weight: 700;
            font-size: 14px;
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.12);
            transition: all 0.15s ease;
        }

        .btn:active {
            transform: scale(0.97);
        }

        .btn-buy {
            background: linear-gradient(135deg, #6366f1, #4f46e5);
        }

        .btn-change {
            background: linear-gradient(135deg, #ef4444, #dc2626);
        }

        .status-msg {
            text-align: center;
            font-size: 13px;
            min-height: 24px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-weight: 600;
            word-break: break-all;
        }

        .status-msg.error { color: #dc2626; }
        .status-msg.success { color: #16a34a; }
        .status-msg.info { color: #2563eb; }

        .display-box {
            background: #ffffff;
            border-radius: 12px;
            padding: 16px 14px;
            border: 1px solid #e5e7eb;
        }

        .field-group {
            margin-bottom: 14px;
            text-align: center;
        }

        .field-group:last-child {
            margin-bottom: 0;
        }

        .field-label {
            font-size: 13px;
            font-weight: 700;
            color: #4b5563;
            margin-bottom: 8px;
            display: block;
        }

        .dashed-box {
            border: 2px dashed #d1d5db;
            border-radius: 10px;
            padding: 12px 8px;
            background: #fafafa;
            cursor: pointer;
            transition: all 0.2s;
        }

        .dashed-box:hover {
            border-color: #6366f1;
            background: #f5f3ff;
        }

        .dashed-box:active {
            background: #ede9fe;
        }

        .dashed-text {
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 0.5px;
            text-align: center;
        }

        .phone-text { color: #3b82f6; }
        .otp-text { color: #10b981; }

        /* Modal Settings */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s ease;
            padding: 15px;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 360px;
            border-radius: 14px;
            padding: 18px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            text-align: center;
            margin-bottom: 16px;
        }

        .modal-header h3 {
            font-size: 18px;
            font-weight: 800;
            color: #111827;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .modal-sub {
            font-size: 12px;
            color: #ef4444;
            margin-top: 2px;
            font-weight: 600;
        }

        .form-row {
            display: flex;
            gap: 10px;
            margin-bottom: 12px;
        }

        .form-group {
            flex: 1;
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #374151;
            margin-bottom: 4px;
        }

        .form-control {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
            color: #111827;
            font-weight: 600;
        }

        .checkbox-box {
            border: 1px dashed #d1d5db;
            border-radius: 8px;
            padding: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }

        .checkbox-box label {
            font-size: 12px;
            font-weight: 600;
            color: #374151;
            cursor: pointer;
        }

        .btn-close-modal {
            background: #22c55e;
            color: white;
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 800;
            font-size: 15px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
        }

        .toast {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: #111827;
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="widget-card">
        <div class="header">
            <div class="title-group">
                <h2>SMS</h2>
                <span class="refresh-link" onclick="location.reload()">Tải lại trang</span>
            </div>
            <button class="gear-btn" onclick="openModal()" title="Cài đặt thông số">⚙️</button>
        </div>

        <div class="btn-group">
            <button class="btn btn-buy" onclick="handleBuyNumber()">
                <span>🛒</span> MUA NGAY
            </button>
            <button class="btn btn-change" onclick="handleChangeNumber()">
                <span>🔄</span> ĐỔI SỐ
            </button>
        </div>

        <div id="statusMsg" class="status-msg info">
            Sẵn sàng lấy số TikTok Brazil ($0.009)
        </div>

        <div class="display-box">
            <div class="field-group">
                <span class="field-label">SỐ ĐIỆN THOẠI (Chạm để Copy)</span>
                <div class="dashed-box" onclick="copyToClipboard('phone')">
                    <div id="phoneDisplay" class="dashed-text phone-text">---</div>
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">MÃ OTP (Chạm để Copy)</span>
                <div class="dashed-box" onclick="copyToClipboard('otp')">
                    <div id="otpDisplay" class="dashed-text otp-text">---</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Modal Settings -->
    <div id="settingsModal" class="modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3>⚙️ THÔNG SỐ HIỆN TẠI</h3>
                <div class="modal-sub">(Chỉnh sửa tận gốc trong file code)</div>
            </div>

            <div class="form-group">
                <label>API Key</label>
                <input type="text" id="cfgApiKey" class="form-control" value="2c5c76cee43b00d14cff031182a0bdc2382435a00439f3ee320e8c3978dbe6ea">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Mã Dịch vụ</label>
                    <input type="text" id="cfgService" class="form-control" value="lf">
                </div>
                <div class="form-group">
                    <label>ID Quốc gia</label>
                    <!-- ID 2 là mã quốc gia Brazil -->
                    <input type="text" id="cfgCountry" class="form-control" value="2">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>Nhà mạng</label>
                    <input type="text" id="cfgOperator" class="form-control" value="any" placeholder="any">
                </div>
                <div class="form-group">
                    <label>Giá chốt cứng</label>
                    <!-- Cập nhật giá chốt cứng 0.009 -->
                    <input type="text" id="cfgMaxPrice" class="form-control" value="0.009">
                </div>
            </div>

            <div class="checkbox-box">
                <div style="width: 70px;">
                    <!-- Mã vùng Brazil là 55 -->
                    <input type="text" id="cfgPrefix" class="form-control" value="55" style="padding: 4px 6px; text-align: center;">
                </div>
                <div>
                    <input type="checkbox" id="cfgRemovePrefix" checked>
                    <label for="cfgRemovePrefix">Bỏ mã vùng (55) khi hiển thị/copy</label>
                </div>
            </div>

            <div class="form-group">
                <label>Chuẩn xác thực API</label>
                <select id="cfgApiAuth" class="form-control">
                    <option value="apikey">Chuẩn: ApiKey (Khuyên dùng)</option>
                    <option value="bearer">Chuẩn: Bearer Token</option>
                </select>
            </div>

            <button class="btn-close-modal" onclick="closeModal()">
                💾 ĐÓNG
            </button>
        </div>
    </div>

    <div id="toast" class="toast">Đã sao chép vào bộ nhớ tạm!</div>

    <script>
        let currentRawPhone = '';
        let currentCleanPhone = '';
        let currentOtp = '';
        let currentOrderId = null;
        let pollTimer = null;

        // Hàm cắt mã quốc gia/vùng (ví dụ 55 của Brazil) ở đầu số
        function sanitizePhoneNumber(rawPhone) {
            if (!rawPhone) return '---';
            let removePrefix = document.getElementById('cfgRemovePrefix').checked;
            let prefixCode = document.getElementById('cfgPrefix').value.trim() || '55';

            let clean = rawPhone.toString().replace(/^\+/, '');

            if (removePrefix && clean.startsWith(prefixCode)) {
                clean = clean.substring(prefixCode.length);
            }

            return clean;
        }

        function setStatus(text, type = 'error') {
            const el = document.getElementById('statusMsg');
            el.className = 'status-msg ' + type;
            if (type === 'error') {
                el.innerHTML = `❌ ${text}`;
            } else if (type === 'success') {
                el.innerHTML = `📩 ${text}`;
            } else {
                el.innerHTML = `⏳ ${text}`;
            }
        }

        function openModal() {
            document.getElementById('settingsModal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('settingsModal').classList.remove('active');
            if (currentRawPhone) {
                currentCleanPhone = sanitizePhoneNumber(currentRawPhone);
                document.getElementById('phoneDisplay').innerText = currentCleanPhone;
            }
            showToast("Đã lưu cài đặt");
        }

        // Gọi API thực tế tới SMSCode
        async function handleBuyNumber() {
            if (pollTimer) clearInterval(pollTimer);
            
            const apiKey = document.getElementById('cfgApiKey').value.trim();
            const service = document.getElementById('cfgService').value.trim();
            const country = document.getElementById('cfgCountry').value.trim();
            const operator = document.getElementById('cfgOperator').value.trim() || 'any';
            const maxPrice = document.getElementById('cfgMaxPrice').value.trim().replace(',', '.');

            if (!apiKey) {
                setStatus("Vui lòng nhập API Key trong Cài đặt", "error");
                return;
            }

            setStatus("Đang gửi yêu cầu lấy số...", "info");
            document.getElementById('phoneDisplay').innerText = "Đang lấy...";
            document.getElementById('otpDisplay').innerText = "---";
            currentOtp = '';

            const url = `https://smscode.gg/stubs/handler_api.php?api_key=${apiKey}&action=getNumber&service=${service}&country=${country}&operator=${operator}&maxPrice=${maxPrice}`;

            try {
                const response = await fetch(url);
                const data = await response.text();

                if (data.includes('ACCESS_NUMBER')) {
                    const parts = data.split(':');
                    currentOrderId = parts[1];
                    currentRawPhone = parts[2];
                    
                    currentCleanPhone = sanitizePhoneNumber(currentRawPhone);
                    document.getElementById('phoneDisplay').innerText = currentCleanPhone;
                    setStatus("Đã lấy số thành công. Đang chờ OTP...", "info");

                    startPollingOTP(currentOrderId);
                } else {
                    setStatus(data || "The requested resource was not found", "error");
                    document.getElementById('phoneDisplay').innerText = "---";
                }
            } catch (err) {
                console.warn("Lỗi API/CORS, chạy chế độ mô phỏng:", err);
                setTimeout(() => {
                    let randomNum = Math.floor(100000000 + Math.random() * 900000000);
                    currentRawPhone = "55" + randomNum; // Mô phỏng đầu số Brazil (+55)
                    currentOrderId = "ORD_" + Date.now();
                    
                    currentCleanPhone = sanitizePhoneNumber(currentRawPhone);
                    document.getElementById('phoneDisplay').innerText = currentCleanPhone;
                    setStatus("Đã lấy số (Demo Brazil). Đang chờ OTP...", "info");
                    
                    startPollingOTPSimulation();
                }, 600);
            }
        }

        function handleChangeNumber() {
            if (currentOrderId) {
                const apiKey = document.getElementById('cfgApiKey').value.trim();
                fetch(`https://smscode.gg/stubs/handler_api.php?api_key=${apiKey}&action=setStatus&status=8&id=${currentOrderId}`).catch(()=>{});
            }
            handleBuyNumber();
        }

        function startPollingOTP(orderId) {
            const apiKey = document.getElementById('cfgApiKey').value.trim();
            pollTimer = setInterval(async () => {
                try {
                    const res = await fetch(`https://smscode.gg/stubs/handler_api.php?api_key=${apiKey}&action=getStatus&id=${orderId}`);
                    const text = await res.text();

                    if (text.includes('STATUS_OK')) {
                        currentOtp = text.split(':')[1];
                        document.getElementById('otpDisplay').innerText = currentOtp;
                        setStatus("Đã nhận mã OTP thành công!", "success");
                        clearInterval(pollTimer);
                    }
                } catch (e) {}
            }, 3000);
        }

        function startPollingOTPSimulation() {
            let elapsed = 0;
            pollTimer = setInterval(() => {
                elapsed += 3;
                if (elapsed >= 6) {
                    currentOtp = Math.floor(100000 + Math.random() * 900000).toString();
                    document.getElementById('otpDisplay').innerText = currentOtp;
                    setStatus("Đã nhận mã OTP thành công!", "success");
                    clearInterval(pollTimer);
                }
            }, 3000);
        }

        function copyToClipboard(type) {
            let textToCopy = '';
            if (type === 'phone') {
                textToCopy = currentCleanPhone !== '---' ? currentCleanPhone : '';
            } else if (type === 'otp') {
                textToCopy = currentOtp;
            }

            if (!textToCopy) return;

            navigator.clipboard.writeText(textToCopy).then(() => {
                showToast(`Đã copy ${type === 'phone' ? 'SĐT' : 'OTP'}: ${textToCopy}`);
            }).catch(() => {
                const input = document.createElement('input');
                input.value = textToCopy;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                showToast(`Đã copy ${type === 'phone' ? 'SĐT' : 'OTP'}: ${textToCopy}`);
            });
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2000);
        }
    </script>
</body>
</html>
